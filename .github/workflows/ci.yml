name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Le build de Monaco dépasse parfois la mémoire par défaut de Node sur les runners macOS.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests unitaires, sécurité, performance
        run: npm test
      - run: npm run build
      - name: Tests E2E (macOS, Windows)
        # Cibles de l'app. Sous Linux sans trousseau, safeStorage refuse de chiffrer le jeton : la connexion est impossible.
        if: runner.os != 'Linux'
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
