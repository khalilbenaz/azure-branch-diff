name: Release

on:
  push:
    tags: ['v*']

# Lecture seule par défaut : seul le job de publication peut écrire.
permissions:
  contents: read

jobs:
  check:
    name: Vérifier le tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Le tag correspond à package.json et pointe sur main
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME ≠ package.json $version"; exit 1; fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Le tag n'est pas sur main"; exit 1; }

  build:
    name: Installeurs (${{ matrix.os }})
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Construire les installeurs
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Vérifier l'app packagée (démarrage, fuses)
        run: npx playwright test packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publier la release (brouillon)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Créer la release en brouillon
        # Brouillon : invisible pour les mises à jour automatiques tant qu'un mainteneur ne l'a pas publiée.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Azure Branch Diff ${GITHUB_REF_NAME#v}" \
            --generate-notes --draft --verify-tag
