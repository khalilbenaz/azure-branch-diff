name: Release

on:
  push:
    tags: ['v*']

# Lecture seule par défaut : seul le job de publication peut écrire.
permissions:
  contents: read

# Le build de Monaco dépasse parfois la mémoire par défaut de Node sur les runners macOS.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  check:
    name: Vérifier le tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Le tag correspond à package.json et pointe sur main
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME ≠ package.json $version"; exit 1; fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Le tag n'est pas sur main"; exit 1; }

  build:
    name: Installeurs (${{ matrix.os }})
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Certificat de signature macOS (auto-signé, identité stable)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "Pas de certificat : signature ad hoc."; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(openssl rand -hex 24)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          sha1="$(security find-identity -p codesigning "$kc" | awk '/Azure Branch Diff Code Signing/ {print $2; exit}')"
          test -n "$sha1"
          echo "MAC_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "MAC_SIGN_IDENTITY=$sha1" >> "$GITHUB_ENV"
      - name: Construire les installeurs
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Vérifier l'app packagée (démarrage, fuses)
        run: npx playwright test packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release.noindex/*.dmg
            release.noindex/*.zip
            release.noindex/*.exe
            release.noindex/*.blockmap
            release.noindex/latest*.yml
          if-no-files-found: error

  publish:
    name: Publier la release (brouillon)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Créer la release en brouillon
        # Brouillon : invisible pour les mises à jour automatiques tant qu'un mainteneur ne l'a pas publiée.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Azure Branch Diff ${GITHUB_REF_NAME#v}" \
            --generate-notes --draft --verify-tag
